{% load lab_tags %}<div class="table-scroll diff-table"><table><thead><tr><th>ПОЛЕ</th>{% if event.before %}<th>ДО ИЗМЕНЕНИЯ</th>{% endif %}<th>СОХРАНЕНО</th></tr></thead><tbody>{% for change in event|event_changes %}<tr><td>{{ change.label }}</td>{% if event.before %}<td><span class="preserve-text">{{ change.before }}</span></td>{% endif %}<td><span class="preserve-text">{{ change.after }}</span></td></tr>{% empty %}<tr><td colspan="3">Сведения о записи сохранены.</td></tr>{% endfor %}</tbody></table></div>
