<div id="{{ formset.prefix }}-formset">
  {{ formset.management_form }}
  {{ formset.non_form_errors }}
  <div class="formset-rows">
    {% for row in formset %}
      {% include 'lab/includes/formset_row.html' %}
    {% endfor %}
  </div>
  <template>
    {% include 'lab/includes/formset_row.html' with row=formset.empty_form %}
  </template>
  <div class="formset-controls">
    <button type="button" class="button small"
            data-add-form="{{ formset.prefix }}-formset"
            aria-controls="{{ formset.prefix }}-formset">+ Добавить строку</button>
  </div>
</div>
