services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lims}
      POSTGRES_USER: ${POSTGRES_USER:-lims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    environment: &app_environment
      DEBUG: "0"
      DEMO_MODE: ${DEMO_MODE:-0}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH:?Set SITE_PASSWORD_HASH in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lims}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lims}
      CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
      CLOUD_RU_MODEL: ${CLOUD_RU_MODEL:-deepseek-ai/DeepSeek-V4-Pro}
      CLOUD_RU_BASE_URL: ${CLOUD_RU_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      CLOUD_RU_TIMEOUT: ${CLOUD_RU_TIMEOUT:-90}
      ASSISTANT_MAX_TOOL_ROUNDS: ${ASSISTANT_MAX_TOOL_ROUNDS:-5}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles

  assistant-worker:
    build: .
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "assistant_worker"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ALLOWED_IPS: ${ALLOWED_IPS:-127.0.0.1/32 ::1/128}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  staticfiles:
  caddy_data:
  caddy_config:
